name: IndexNow

# After each push to main, tell IndexNow which sitemap pages changed.
# Vercel deploys main on the same push, so wait for it before pinging.
on:
  push:
    branches: [main]
    paths: ["**.html"]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for the Vercel deploy
        run: sleep 120
      - name: Ping IndexNow
        run: python3 scripts/indexnow.py "${{ github.event.before }}" "${{ github.sha }}"
